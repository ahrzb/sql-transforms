[project]
name = "sql-transform"
version = "0.1.0"
description = "SQL-based data transforms on DataFusion"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "confit",
    "datafusion>=46.0.0",
    "pyarrow>=19.0",
    "pydantic>=2.0,<3.0",
    "sqlglot>=30.12.0",
]

[tool.uv.sources]
confit = { workspace = true }

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "sql_transform._interpreter"
python-source = "."
exclude = ["**/*_test.py", "tests/**"]
# See the note in Cargo.toml: extension-module only for the built wheel,
# so `cargo test` can link libpython.
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
# The repo-root `benchmarks` package carries the shared serving-scenario
# parity fixtures used by these tests.
pythonpath = ["../.."]
testpaths = ["tests", "sql_transform"]
