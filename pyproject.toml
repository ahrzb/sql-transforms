[project]
name = "sql-transform"
version = "0.1.0"
description = "SQL-based data transforms on DataFusion"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datafusion>=46.0.0",
    "pyarrow>=19.0",
    "pydantic>=2.0,<3.0",
    "sqlglot>=30.12.0",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "ipdb>=0.13.13",
    "ipython>=9.2.0",
    "maturin>=1.14,<2.0",
    "notebook>=7.6.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "sql_transform._interpreter"
python-source = "."
exclude = ["**/*_test.py", "tests/**"]
# See the note in Cargo.toml: extension-module only for the built wheel,
# so `cargo test` can link libpython.
features = ["pyo3/extension-module"]

[tool.ruff]
fix = true
lint.select = ["E", "F", "B", "I", "UP", "C4", "S"]
lint.ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"*test*.py" = ["S608"]
"_state.py" = ["S608"]
# Doc generator: emits long markdown lines verbatim; wrapping would corrupt output.
"scripts/gen_datafusion_catalogue.py" = ["E501"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
# Scope collection: the duckdb/ source clone (reference corpus) carries its own
# test_*.py scripts that break under our pytest.
testpaths = ["tests", "sql_transform"]
