[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
confit = { workspace = true }
sql-transform = { workspace = true }

# The workspace root is virtual: it ships no code of its own. It carries the
# dev toolchain and the repo-wide lint/test configuration so one `uv run pytest`
# still gates every package.
[dependency-groups]
dev = [
    "confit",
    "sql-transform",
    "duckdb>=1.5.5",
    "ipdb>=0.13.13",
    "ipython>=9.2.0",
    "maturin>=1.14,<2.0",
    "notebook>=7.6.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "pre-commit>=4.6.0",
    "pytest>=8.3.5",
    "ruff>=0.11.7",
    "scikit-learn>=1.5",
]

[tool.ruff]
fix = true
lint.select = ["E", "F", "B", "I", "UP", "C4", "S"]
lint.ignore = ["S101"]

[tool.ruff.lint.isort]
# duckdb is a pip package, but a same-named directory exists in-repo (the
# duckdb/ source clone), which makes isort's src-root scan misclassify the
# imports as first-party.
known-third-party = ["duckdb"]

[tool.ruff.lint.per-file-ignores]
"*test*.py" = ["S608"]
"_state.py" = ["S608"]
# Bench fixtures: seeded pseudo-random data generators (S311 is about
# crypto), dense SQL/data-gen literals where wrapping hurts readability,
# and SQL assembled from module-internal constants (S608, no user input).
"benchmarks/serving_scenarios/*.py" = ["S311", "E501", "S608"]

[tool.pytest.ini_options]
python_files = ["*_test.py", "test_*.py"]
# `benchmarks/` lives at the repo root and is imported by both packages' test
# suites (the serving scenarios are the shared parity fixtures). `python -m
# pytest` would put the cwd on sys.path and hide this; the `pytest` console
# script does not, so state it.
pythonpath = ["."]
# Scope collection: the duckdb/ source clone (reference corpus) carries its own
# test_*.py scripts that break under our pytest. Every package's tests are
# listed so `pytest` from the repo root is the whole gate.
testpaths = [
    "packages/confit/tests",
    "packages/sql-transform/sql_transform",
]
