name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The package is a pyo3/maturin extension, so CI needs a Rust toolchain
      # to build it during `uv sync`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The dialect cross-engine gate executes printed SQL on a live local
      # Spark session (packages/confit/tests/test_dialect_cross_engine_gate.py);
      # its pins were measured under JDK 21, so CI runs the same.
      - name: Install JDK for Spark
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Provisions Python 3.14 (per requires-python), builds the extension, and
      # installs locked deps. The `spark` group carries pyspark, which the
      # cross-engine gate hard-requires; it is not in `dev` so local syncs
      # stay light.
      - name: Build extension + install deps
        run: uv sync --locked --group spark

      # Lint + formatting go through pre-commit so CI enforces exactly what the
      # local hooks do (config: .pre-commit-config.yaml), rather than a second,
      # drift-prone copy of the ruff invocations.
      # --no-sync on both run steps: the sync step above already built the
      # exact env (dev + spark), and a bare `uv run` would normalize it back
      # to the default groups, uninstalling pyspark out from under the gate.
      - name: Lint + format (pre-commit)
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run --no-sync pytest -q
